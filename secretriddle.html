<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mystery Riddle</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .riddle-card {
            background: #1e293b;
            border: 2px solid #38bdf8;
            border-radius: 16px;
            padding: 30px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }
        h1 {
            color: #38bdf8;
            font-size: 22px;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .riddle-text {
            background: #0f172a;
            color: #e2e8f0;
            padding: 20px;
            border-radius: 12px;
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 25px;
            border-left: 4px solid #38bdf8;
            font-weight: 500;
        }
        input[type="text"] {
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #fff;
            font-size: 16px;
            outline: none;
            margin-bottom: 15px;
            text-align: center;
            text-transform: uppercase; /* टाइप करते ही अक्षर बड़े दिखने लगेंगे */
        }
        input[type="text"]:focus {
            border-color: #38bdf8;
        }
        button {
            width: 100%;
            padding: 14px;
            background: #38bdf8;
            color: #0f172a;
            border: none;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s ease;
        }
        button:hover {
            background: #0284c7;
            color: #fff;
        }
        #message {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
        }
        .success {
            color: #22c55e;
        }
        .error {
            color: #ef4444;
        }
    </style>
</head>
<body>

    <div class="riddle-card">
        <h1>🔍 Mystery Riddle Challenge</h1>
        
        <div class="riddle-text">
            "वह जैसा दिखता है, वह वैसा नहीं है। वह उससे भी कुछ बढ़कर है जिसकी इंसान कल्पना नहीं कर सकता।"
        </div>

        <input type="text" id="answer" placeholder="उत्तर यहाँ दर्ज करें...">
        <button onclick="solveRiddle()">Unlock Riddle</button>

        <div id="message"></div>
    </div>

    <script>
        function solveRiddle() {
            // यहाँ `.trim()` का इस्तेमाल किया गया है ताकि सिर्फ 'SAGAR' (कैपिटल लेटर्स) मैच हो सके
            const input = document.getElementById('answer').value.trim();
            const message = document.getElementById('message');

            if (input === "SAGAR" || input === "सागर" || input === "SAGAR PANCHAL") {
                message.className = "success";
                message.innerHTML = "🎉 सही जवाब! पहेली सफलतापूर्वक सॉल्व हो गई है।";
            } else {
                message.className = "error";
                message.innerHTML = "❌ गलत उत्तर! कृपया 'SAGAR' दर्ज करें।";
            }
        }
    </script>

</body>
</html>
